<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проект приостановлен</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f0f2f5;
        color: #333;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 48px;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      }
      .icon { font-size: 48px; margin-bottom: 16px; }
      h1 { font-size: 22px; margin-bottom: 12px; }
      p { color: #666; line-height: 1.6; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🏫</div>
      <h1>Проект приостановлен</h1>
      <p>Сайт выпускников Маисской школы 2006 года временно недоступен.<br>Спасибо всем, кто был с нами.</p>
    </div>
  </body>
</html>
